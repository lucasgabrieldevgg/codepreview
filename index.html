<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CodePreview — Visualizador de Código</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#c9d1d9;--dim:#8b949e;--accent:#58a6ff;--green:#3fb950;--red:#f85149}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{background:var(--card);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;align-items:center;gap:12px;flex-shrink:0}
header h1{font-size:16px;font-weight:600;display:flex;align-items:center;gap:8px}
header h1 span{color:var(--accent)}
.toolbar{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
.btn{background:var(--card);border:1px solid var(--border);color:var(--text);padding:6px 12px;border-radius:6px;cursor:pointer;font-size:12px;display:flex;align-items:center;gap:4px;transition:.15s}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-primary:hover{opacity:.85;color:#fff}
.btn-danger:hover{border-color:var(--red);color:var(--red)}
.main{flex:1;display:flex;overflow:hidden}
.editor-pane{flex:1;display:flex;flex-direction:column;overflow:hidden;border-right:1px solid var(--border)}
.blocks{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:12px}
.block{background:var(--card);border:1px solid var(--border);border-radius:8px;overflow:hidden;display:flex;flex-direction:column}
.block-header{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--border);background:rgba(255,255,255,.02)}
.block-header select{background:var(--bg);border:1px solid var(--border);color:var(--text);padding:4px 8px;border-radius:4px;font-size:12px;cursor:pointer}
.block-header .block-name{font-size:12px;color:var(--dim);font-family:monospace;flex:1}
.block-header .btn-icon{background:none;border:none;color:var(--dim);cursor:pointer;padding:4px;border-radius:4px;font-size:14px}
.block-header .btn-icon:hover{color:var(--red)}
.block textarea{background:var(--bg);border:none;color:var(--text);padding:12px;font-family:'SF Mono',Monaco,Consolas,monospace;font-size:13px;line-height:1.5;resize:vertical;min-height:150px;flex:1;outline:none;width:100%}
.block textarea:focus{background:#0a0e14}
.preview-pane{flex:1;display:flex;flex-direction:column;overflow:hidden}
.preview-tabs{display:flex;background:var(--card);border-bottom:1px solid var(--border);padding:0 12px;gap:4px;flex-shrink:0}
.preview-tab{padding:8px 16px;font-size:12px;color:var(--dim);cursor:pointer;border-bottom:2px solid transparent;transition:.15s}
.preview-tab:hover{color:var(--text)}
.preview-tab.active{color:var(--accent);border-color:var(--accent)}
.preview-content{flex:1;overflow:hidden;position:relative}
.preview-content iframe{width:100%;height:100%;border:none;background:#fff}
.code-view{padding:16px;overflow-y:auto;height:100%;font-family:monospace;font-size:13px;line-height:1.5;white-space:pre-wrap;word-break:break-word;color:var(--text)}
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--dim);gap:12px;text-align:center;padding:20px}
.empty-state .icon{font-size:48px;opacity:.3}
.empty-state p{font-size:14px;max-width:300px}
.file-info{padding:8px 12px;font-size:11px;color:var(--dim);font-family:monospace;border-top:1px solid var(--border);background:rgba(255,255,255,.01);flex-shrink:0}
.badge{font-size:10px;padding:2px 6px;border-radius:4px;background:var(--accent);color:#fff;font-weight:600}
.badge-green{background:var(--green)}
.drop-zone{border:2px dashed var(--border);border-radius:8px;padding:20px;text-align:center;color:var(--dim);font-size:13px;cursor:pointer;transition:.15s}
.drop-zone:hover,.drop-zone.dragover{border-color:var(--accent);color:var(--accent);background:rgba(88,166,255,.05)}
@media(max-width:768px){.main{flex-direction:column}.editor-pane{border-right:none;border-bottom:1px solid var(--border);max-height:50%}.preview-pane{min-height:50%}}
</style>
</head>
<body>

<header>
  <h1>📋 <span>Code</span>Preview</h1>
  <div class="toolbar">
    <button class="btn btn-primary" onclick="addBlock()">+ Bloco</button>
    <label class="btn" title="Upload de arquivo">
      📄 Arquivo
      <input type="file" onchange="handleFiles(this.files)" hidden accept=".html,.htm,.css,.js,.json,.md,.txt,.py,.xml,.svg">
    </label>
    <label class="btn" title="Upload de pasta">
      📁 Pasta
      <input type="file" onchange="handleFiles(this.files)" webkitdirectory hidden>
    </label>
    <button class="btn" onclick="updatePreview()" title="Atualizar preview (Ctrl+Enter)">▶ Preview</button>
    <button class="btn btn-danger" onclick="clearAll()" title="Limpar tudo">🗑</button>
  </div>
</header>

<div class="main">
  <div class="editor-pane">
    <div class="blocks" id="blocks">
      <!-- Blocks added here -->
    </div>
    <div class="file-info" id="fileInfo">Nenhum arquivo carregado</div>
  </div>
  <div class="preview-pane">
    <div class="preview-tabs">
      <div class="preview-tab active" onclick="switchTab('preview',this)">👁 Preview</div>
      <div class="preview-tab" onclick="switchTab('code',this)">📝 Código</div>
    </div>
    <div class="preview-content" id="previewContent">
      <div class="empty-state">
        <div class="icon">👁</div>
        <p>Cole código ou faça upload de arquivos.<br>O preview aparece aqui automaticamente.</p>
      </div>
    </div>
  </div>
</div>

<script>
let blockCount = 0;

const LANGUAGES = [
  {value: 'html', label: 'HTML', ext: ['html','htm'], preview: true},
  {value: 'css', label: 'CSS', ext: ['css'], preview: true},
  {value: 'javascript', label: 'JavaScript', ext: ['js'], preview: true},
  {value: 'markdown', label: 'Markdown', ext: ['md','markdown'], preview: true},
  {value: 'json', label: 'JSON', ext: ['json'], preview: false},
  {value: 'python', label: 'Python', ext: ['py'], preview: false},
  {value: 'xml', label: 'XML', ext: ['xml','svg'], preview: false},
  {value: 'text', label: 'Texto', ext: ['txt'], preview: false},
];

function getLangByExt(ext) {
  for (const lang of LANGUAGES) {
    if (lang.ext.includes(ext.toLowerCase())) return lang.value;
  }
  return 'text';
}

function addBlock(lang = 'html', content = '', name = '') {
  blockCount++;
  const id = 'block-' + blockCount;
  const div = document.createElement('div');
  div.className = 'block';
  div.id = id;
  
  const options = LANGUAGES.map(l => 
    `<option value="${l.value}" ${l.value === lang ? 'selected' : ''}>${l.label}</option>`
  ).join('');
  
  div.innerHTML = `
    <div class="block-header">
      <select onchange="updatePreview()">
        ${options}
      </select>
      <span class="block-name">${name || 'Bloco ' + blockCount}</span>
      <button class="btn-icon" onclick="removeBlock('${id}')" title="Remover">✕</button>
    </div>
    <textarea oninput="schedulePreview()" placeholder="Cole seu código aqui...">${content}</textarea>
  `;
  document.getElementById('blocks').appendChild(div);
  schedulePreview();
}

function removeBlock(id) {
  document.getElementById(id).remove();
  if (document.querySelectorAll('.block').length === 0) {
    addBlock();
  }
  updatePreview();
}

function getBlocks() {
  return Array.from(document.querySelectorAll('.block')).map(block => {
    const select = block.querySelector('select');
    const textarea = block.querySelector('textarea');
    const name = block.querySelector('.block-name').textContent;
    return {
      lang: select.value,
      content: textarea.value,
      name: name,
    };
  });
}

let previewTimer = null;
function schedulePreview() {
  clearTimeout(previewTimer);
  previewTimer = setTimeout(updatePreview, 400);
}

function updatePreview() {
  const blocks = getBlocks();
  if (blocks.length === 0 || blocks.every(b => !b.content.trim())) {
    showEmpty();
    return;
  }

  // Check if any block is previewable
  const hasPreviewable = blocks.some(b => {
    const lang = LANGUAGES.find(l => l.value === b.lang);
    return lang && lang.preview;
  });

  if (currentTab === 'preview' && hasPreviewable) {
    const html = buildPreviewHTML(blocks);
    showIframe(html);
  } else {
    showCode(blocks);
  }
}

function buildPreviewHTML(blocks) {
  let html = '';
  let css = '';
  let js = '';
  let markdown = '';

  for (const block of blocks) {
    if (block.lang === 'html') html += block.content + '\n';
    else if (block.lang === 'css') css += block.content + '\n';
    else if (block.lang === 'javascript') js += block.content + '\n';
    else if (block.lang === 'markdown') markdown += block.content + '\n';
  }

  // If only markdown, render it as HTML
  if (markdown && !html) {
    html = markdownToHtml(markdown);
  }

  // If no HTML but has CSS or JS, create a basic HTML wrapper
  if (!html && (css || js)) {
    html = '<div id="app"></div>';
  }

  if (!html && !css && !js && !markdown) return null;

  return '<!DOCTYPE html>\n<html>\n<head>\n<meta charset="UTF-8">\n<style>\nbody{font-family:-apple-system,sans-serif;padding:20px;margin:0}\n' + css + '\n</style>\n</head>\n<body>\n' + html + '\n<' + 'script>\ntry{\n' + js + '\n}catch(e){\ndocument.body.innerHTML+="<pre style=\\"color:red;padding:10px;background:#fee;border-radius:4px;margin-top:10px\\">Error: "+e.message+"</pre>";\n}\n</' + 'script>\n</body>\n</html>';
}

function markdownToHtml(md) {
  return md
    .replace(/^# (.+)$/gm, '<h1>$1</h1>')
    .replace(/^## (.+)$/gm, '<h2>$1</h2>')
    .replace(/^### (.+)$/gm, '<h3>$1</h3>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    .replace(/`(.+?)`/g, '<code>$1</code>')
    .replace(/\n\n/g, '</p><p>')
    .replace(/^- (.+)$/gm, '<li>$1</li>')
    .replace(/(<li>.*<\/li>)/s, '<ul>$1</ul>')
    .replace(/^\|(.+)\|$/gm, '<tr><td>$1</td></tr>')
    .wrap('<p>', '</p>');
}

String.prototype.wrap = function(open, close) {
  return open + this + close;
};

function showIframe(html) {
  const container = document.getElementById('previewContent');
  container.innerHTML = '<iframe id="previewFrame" sandbox="allow-scripts"></iframe>';
  const frame = document.getElementById('previewFrame');
  frame.srcdoc = html;
}

function showCode(blocks) {
  const container = document.getElementById('previewContent');
  const code = blocks.map(b => {
    const lang = LANGUAGES.find(l => l.value === b.lang);
    return `<!-- ${b.name} (${lang ? lang.label : b.lang}) -->\n${b.content}`;
  }).join('\n\n---\n\n');
  container.innerHTML = `<div class="code-view">${escapeHtml(code)}</div>`;
}

function showEmpty() {
  document.getElementById('previewContent').innerHTML = `
    <div class="empty-state">
      <div class="icon">👁</div>
      <p>Cole código ou faça upload de arquivos.<br>O preview aparece aqui automaticamente.</p>
    </div>`;
}

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

let currentTab = 'preview';
function switchTab(tab, el) {
  currentTab = tab;
  document.querySelectorAll('.preview-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  updatePreview();
}

function handleFiles(files) {
  const valid = [];
  let skipped = 0;
  for (const file of files) {
    const ext = file.name.split('.').pop() || 'txt';
    const lang = getLangByExt(ext);
    valid.push({name: file.name, lang, ext});
  }
  
  // Read each file
  let loaded = 0;
  for (const file of files) {
    const ext = file.name.split('.').pop() || 'txt';
    const lang = getLangByExt(ext);
    const reader = new FileReader();
    reader.onload = (e) => {
      addBlock(lang, e.target.result, file.name);
      loaded++;
      if (loaded === files.length) {
        updateFileInfo(files);
        updatePreview();
      }
    };
    reader.readAsText(file);
  }
}

function updateFileInfo(files) {
  const info = document.getElementById('fileInfo');
  if (files.length === 1) {
    info.textContent = `📄 ${files[0].name} (${(files[0].size/1024).toFixed(1)}KB)`;
  } else {
    const langs = {};
    for (const f of files) {
      const ext = f.name.split('.').pop() || 'txt';
      langs[ext] = (langs[ext] || 0) + 1;
    }
    const summary = Object.entries(langs).map(([ext, count]) => `${count}× .${ext}`).join(', ');
    info.textContent = `📁 ${files.length} arquivos: ${summary}`;
  }
}

function clearAll() {
  if (!confirm('Limpar todos os blocos?')) return;
  document.getElementById('blocks').innerHTML = '';
  blockCount = 0;
  addBlock();
  document.getElementById('fileInfo').textContent = 'Nenhum arquivo carregado';
  updatePreview();
}

// Drag and drop
document.addEventListener('dragover', e => { e.preventDefault(); });
document.addEventListener('drop', e => {
  e.preventDefault();
  const files = e.dataTransfer.files;
  if (files.length > 0) handleFiles(files);
});

// Keyboard shortcut
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
    e.preventDefault();
    updatePreview();
  }
});

// Init
addBlock('html');
</script>
</body>
</html>
